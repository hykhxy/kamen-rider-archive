<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>假面骑士 · 全系列立绘库</title>
<meta name="description" content="假面骑士全系列官方图鉴立绘 10,623 张：骑士 / 形态 / 人物 / 怪人 / 道具，可搜索、可筛选、可直链引用。">
<style>
  :root{
    --bg:#0b0d11; --bg2:#12161d; --bg3:#1a1f28; --line:#272e38;
    --tx:#e9e6e1; --tx2:#9aa3ae; --tx3:#69727e;
    --gold:#d9b45f; --red:#e8474d; --ok:#4fb477;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;color:var(--tx);
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:
      radial-gradient(1000px 480px at 10% -12%, rgba(217,180,95,.10), transparent 62%),
      radial-gradient(900px 460px at 92% -8%, rgba(232,71,77,.09), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  a{color:var(--gold);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ── 顶栏 ── */
  header{position:sticky;top:0;z-index:40;background:rgba(11,13,17,.9);
    backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:14px;padding:11px 18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
  .mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
    font-weight:800;font-size:14px;color:#fff;flex:0 0 auto;
    background:linear-gradient(145deg,var(--red),#7e1b1f);
    box-shadow:0 0 0 1px rgba(217,180,95,.55),0 6px 16px rgba(232,71,77,.22)}
  .brand h1{font-size:14.5px;letter-spacing:1px;font-weight:700;line-height:1.25}
  .brand small{display:block;font-size:9.5px;color:var(--tx3);letter-spacing:1.6px;font-weight:500;margin-top:1px}
  .search{flex:1 1 240px;position:relative;min-width:0}
  .search input{width:100%;height:38px;padding:0 34px 0 34px;border-radius:9px;
    background:var(--bg3);border:1px solid var(--line);color:var(--tx);
    font-size:13.5px;outline:none;font-family:inherit;transition:.18s}
  .search input:focus{border-color:rgba(217,180,95,.6);box-shadow:0 0 0 3px rgba(217,180,95,.1)}
  .search input::placeholder{color:var(--tx3)}
  .search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45;font-size:14px}
  .search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:22px;height:22px;border-radius:5px;border:0;background:transparent;color:var(--tx3);
    cursor:pointer;font-size:14px;display:none}
  .search.has .clr{display:block}
  .stat{font-size:11px;color:var(--tx3);white-space:nowrap}
  .stat b{color:var(--gold)}

  /* ── 类别 tab ── */
  .tabs{display:flex;gap:6px;padding:0 18px 9px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{border:1px solid var(--line);background:transparent;color:var(--tx2);
    padding:6px 13px;border-radius:18px;font-size:12.5px;cursor:pointer;white-space:nowrap;
    font-family:inherit;transition:.16s}
  .tab:hover{color:var(--tx);border-color:#3a424c}
  .tab.on{background:linear-gradient(145deg,rgba(232,71,77,.2),rgba(217,180,95,.16));
    color:var(--tx);border-color:rgba(217,180,95,.55)}
  .tab b{margin-left:5px;font-weight:600;font-size:11px;color:var(--tx3)}
  .tab.on b{color:var(--gold)}

  /* ── 工具行 ── */
  .tools{display:flex;align-items:center;gap:9px;padding:0 18px 11px;flex-wrap:wrap}
  select{background:var(--bg3);border:1px solid var(--line);color:var(--tx2);
    height:31px;padding:0 9px;border-radius:7px;font-size:12px;font-family:inherit;
    outline:none;max-width:210px}
  select:focus{border-color:rgba(217,180,95,.5)}
  .cnt{font-size:12px;color:var(--tx2);margin-left:auto}
  .cnt b{color:var(--gold);font-size:13px}

  /* ── 网格 ── */
  main{padding:14px 18px 90px}
  .grid{display:grid;gap:10px;
    grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  .card{position:relative;border-radius:9px;overflow:hidden;cursor:pointer;
    background:linear-gradient(180deg,#171c24,#11151b);border:1px solid var(--line);
    transition:transform .18s,border-color .18s,box-shadow .18s}
  .card:hover{transform:translateY(-2px);border-color:rgba(217,180,95,.55);
    box-shadow:0 8px 20px rgba(0,0,0,.4)}
  .card .ph{width:100%;aspect-ratio:3/4;display:block;background:var(--bg3)}
  .card img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;
    transition:opacity .3s}
  .card img.ok{opacity:1}
  .card .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 7px 6px;
    background:linear-gradient(180deg,transparent,rgba(8,10,14,.92));
    font-size:11px;line-height:1.35;color:#e6dfd2;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .cat{position:absolute;top:6px;left:6px;font-size:9px;letter-spacing:.5px;
    padding:2px 6px;border-radius:8px;background:rgba(217,180,95,.9);color:#1a1a1a;
    font-weight:600;opacity:0;transition:.18s}
  .card:hover .cat{opacity:1}

  .more{display:flex;justify-content:center;margin-top:26px}
  .more button{font-family:inherit;font-size:13px;color:var(--tx2);cursor:pointer;
    padding:10px 28px;border-radius:20px;background:var(--bg3);
    border:1px solid var(--line);transition:.18s}
  .more button:hover{color:var(--gold);border-color:rgba(217,180,95,.5)}
  .empty{text-align:center;color:var(--tx3);padding:80px 20px;font-size:13.5px;line-height:2}

  /* ── 详情 ── */
  .mask{position:fixed;inset:0;background:rgba(4,6,9,.82);backdrop-filter:blur(5px);
    z-index:60;opacity:0;pointer-events:none;transition:.22s}
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;inset:0;z-index:61;display:flex;align-items:center;justify-content:center;
    padding:18px;pointer-events:none;opacity:0;transition:.22s}
  .sheet.on{opacity:1;pointer-events:auto}
  .box{width:min(880px,100%);max-height:92vh;overflow:auto;border-radius:14px;
    background:var(--bg2);border:1px solid rgba(217,180,95,.35);
    box-shadow:0 26px 70px rgba(0,0,0,.6);display:flex;flex-direction:column}
  @media(min-width:720px){.box{flex-direction:row;align-items:stretch}}
  .box .fig{flex:0 0 auto;background:#0e1117;display:flex;align-items:center;
    justify-content:center;min-height:300px;position:relative}
  @media(min-width:720px){.box .fig{width:44%;max-width:390px;min-height:470px}}
  .box .fig img{width:100%;height:100%;object-fit:contain;max-height:70vh;display:block}
  .box .info{flex:1 1 auto;padding:20px 20px 22px;min-width:0}
  .box .k{font-size:10px;letter-spacing:2.5px;color:var(--gold)}
  .box h2{font-size:19px;margin-top:5px;line-height:1.4;word-break:break-word;padding-right:30px}
  .box .jp{font-size:12px;color:var(--tx3);margin-top:5px;word-break:break-all}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .pill{font-size:10.5px;padding:3px 9px;border-radius:11px;border:1px solid var(--line);
    color:var(--tx3)}
  .pill.e{color:var(--gold);border-color:rgba(217,180,95,.35);background:rgba(217,180,95,.08)}
  .fld{margin-top:16px}
  .fld label{display:block;font-size:10.5px;letter-spacing:1.2px;color:var(--tx3);margin-bottom:5px}
  .fld .v{display:flex;gap:7px;align-items:center}
  .fld input{flex:1 1 auto;min-width:0;height:34px;padding:0 10px;border-radius:7px;
    background:#0c1015;border:1px solid var(--line);color:var(--tx2);font-size:11.5px;
    font-family:ui-monospace,Menlo,Consolas,monospace;outline:none}
  .fld button{flex:0 0 auto;height:34px;padding:0 12px;border-radius:7px;cursor:pointer;
    background:var(--bg3);border:1px solid var(--line);color:var(--tx2);
    font-size:12px;font-family:inherit;transition:.16s}
  .fld button:hover{color:var(--gold);border-color:rgba(217,180,95,.5)}
  .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .acts a{font-size:12px;padding:8px 14px;border-radius:16px;color:var(--tx2);
    border:1px solid var(--line);background:var(--bg3);transition:.16s}
  .acts a:hover{color:var(--gold);border-color:rgba(217,180,95,.5);text-decoration:none}
  .x{position:absolute;right:12px;top:12px;z-index:3;width:30px;height:30px;border-radius:8px;
    background:rgba(18,22,29,.9);border:1px solid var(--line);color:var(--tx2);
    cursor:pointer;font-size:15px;display:grid;place-items:center}
  .x:hover{color:var(--red);border-color:rgba(232,71,77,.5)}

  footer{padding:26px 18px 40px;text-align:center;border-top:1px solid var(--line);
    font-size:11px;color:var(--tx3);line-height:2}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(14px);
    z-index:90;padding:9px 18px;border-radius:18px;font-size:12.5px;color:#e6dabf;
    background:rgba(18,22,29,.96);border:1px solid rgba(217,180,95,.5);
    opacity:0;pointer-events:none;transition:.24s}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:560px){
    .bar{padding:9px 13px;gap:10px}
    .brand h1{font-size:12.5px}
    .brand small{display:none}
    .stat{display:none}
    main{padding:11px 12px 80px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
    .card .cap{font-size:10px}
    .box .fig{min-height:250px}
  }
  @media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">
      <div class="mark">K</div>
      <div>
        <h1>假面骑士 · 全系列立绘库</h1>
        <small>KAMEN RIDER ARCHIVE · 10,623</small>
      </div>
    </div>
    <div class="search" id="swrap">
      <span class="ico">⌕</span>
      <input id="q" placeholder="搜骑士 / 形态 / 人物 / 怪人 / 道具（中文名或原名）" autocomplete="off">
      <button class="clr" id="clr">✕</button>
    </div>
    <div class="stat" id="stat"></div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <select id="series"><option value="">全部系列</option></select>
    <select id="era">
      <option value="">全部时代</option>
      <option value="昭和">昭和 1971–1994</option>
      <option value="平成">平成 2000–2019</option>
      <option value="令和">令和 2019–2023</option>
    </select>
    <select id="sort">
      <option value="seq">按系列顺序</option>
      <option value="name">按名称</option>
      <option value="year">按年份倒序</option>
    </select>
    <div class="cnt" id="cnt"></div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
  <div class="more" id="morewrap" hidden><button id="more">加载更多</button></div>
</main>

<footer>
  图片来源：東映官方図鑑 kamen-rider-official.com／zukan　｜　版权 © 石森プロ・テレビ朝日・ADK EM・東映<br>
  本站为非商业同人资料整理，仅供学习研究；请勿用于商业用途或二次分发。
</footer>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="box">
    <div class="fig"><img id="bigimg" alt="">
      <button class="x" id="x">✕</button>
    </div>
    <div class="info">
      <div class="k">KAMEN RIDER ARCHIVE</div>
      <h2 id="tname"></h2>
      <div class="jp" id="tjp"></div>
      <div class="tags" id="ttags"></div>
      <div class="fld">
        <label>图片直链（可直接贴在网页 / 世界书 / 笔记里）</label>
        <div class="v"><input id="cdn" readonly><button id="copycdn">复制</button></div>
      </div>
      <div class="fld">
        <label>GitHub 原文件</label>
        <div class="v"><input id="gh" readonly><button id="copygh">复制</button></div>
      </div>
      <div class="acts">
        <a id="offi" target="_blank" rel="noopener">官方页 ↗</a>
        <a id="dl" download>下载原图</a>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var REPO = 'hykhxy/kamen-rider-archive';
  var BRANCH = 'main';
  var CDN = 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + BRANCH + '/';
  var RAW = 'https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/';
  var PAGE = 120;

  var CATS = [['','全部'],['骑士','骑士'],['形态','形态'],['人物','人物'],['怪人','怪人'],['道具','道具']];
  var st = {cat:'',series:'',era:'',q:'',sort:'seq',shown:0,list:[]};
  var DATA = [];

  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  var toastT;
  function toast(msg){
    var t=$('toast'); t.textContent=msg; t.classList.add('on');
    clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('on');},1600);
  }
  function copy(text,btn){
    var done=function(){
      var old=btn.textContent; btn.textContent='已复制 ✓';
      setTimeout(function(){btn.textContent=old;},1300);
    };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done,function(){fallback();});
    } else fallback();
    function fallback(){
      var i=document.createElement('textarea'); i.value=text;
      document.body.appendChild(i); i.select();
      try{document.execCommand('copy'); done();}catch(e){toast('复制失败，请手动选择');}
      document.body.removeChild(i);
    }
  }

  // ── 初始化 ──
  fetch('data.json', {cache:'force-cache'}).then(function(r){return r.json();}).then(function(d){
    DATA = d;
    buildTabs(); buildSeries(); bind(); render();
  }).catch(function(e){
    $('empty').hidden=false;
    $('empty').innerHTML='数据加载失败：'+esc(e.message)+'<br>请确认 data.json 与 index.html 在同一目录。';
  });

  function buildTabs(){
    var box=$('tabs'), cnt={};
    DATA.forEach(function(x){cnt[x.c]=(cnt[x.c]||0)+1;});
    var html='';
    CATS.forEach(function(c){
      var n = c[0]? (cnt[c[0]]||0) : DATA.length;
      html+='<button class="tab'+(c[0]===st.cat?' on':'')+'" data-c="'+c[0]+'">'+
            c[1]+'<b>'+n.toLocaleString()+'</b></button>';
    });
    box.innerHTML=html;
    [].forEach.call(box.children,function(b){
      b.onclick=function(){
        st.cat=b.dataset.c; st.shown=0;
        [].forEach.call(box.children,function(x){x.classList.toggle('on',x===b);});
        render();
      };
    });
  }

  function buildSeries(){
    var set={}, arr=[];
    DATA.forEach(function(x){ if(!set[x.s]){set[x.s]=1; arr.push([x.s,x.y||0]);} });
    arr.sort(function(a,b){return (a[1]||9999)-(b[1]||9999);});
    var s=$('series');
    arr.forEach(function(p){
      var o=document.createElement('option');
      o.value=p[0]; o.textContent=p[0]+(p[1]?'（'+p[1]+'）':'');
      s.appendChild(o);
    });
    s.onchange=function(){st.series=s.value; st.shown=0; render();};
    $('era').onchange=function(){st.era=$('era').value; st.shown=0; render();};
    $('sort').onchange=function(){st.sort=$('sort').value; st.shown=0; render();};
  }

  function bind(){
    var timer;
    $('q').addEventListener('input',function(e){
      clearTimeout(timer);
      var v=e.target.value;
      $('swrap').classList.toggle('has',!!v);
      timer=setTimeout(function(){st.q=v.trim().toLowerCase(); st.shown=0; render();},200);
    });
    $('clr').onclick=function(){
      $('q').value=''; $('swrap').classList.remove('has');
      st.q=''; st.shown=0; render(); $('q').focus();
    };
    $('more').onclick=function(){ push(); };
    $('mask').onclick=close;
    $('x').onclick=close;
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape') close();
      if(e.key==='/' && document.activeElement.tagName!=='INPUT'){
        e.preventDefault(); $('q').focus();
      }
    });
  }

  function filtered(){
    var out=[], q=st.q;
    for(var i=0;i<DATA.length;i++){
      var x=DATA[i];
      if(st.cat && x.c!==st.cat) continue;
      if(st.series && x.s!==st.series) continue;
      if(st.era && x.e!==st.era) continue;
      if(q){
        var hay=x.n+' '+x.j+' '+x.s;
        if(hay.toLowerCase().indexOf(q)<0) continue;
      }
      out.push(x);
    }
    if(st.sort==='name'){
      out.sort(function(a,b){return a.n.localeCompare(b.n,'zh');});
    } else if(st.sort==='year'){
      out.sort(function(a,b){return (b.y||0)-(a.y||0) || a.n.localeCompare(b.n,'zh');});
    }
    return out;
  }

  function render(){
    st.list=filtered(); st.shown=0;
    $('grid').innerHTML='';
    $('cnt').innerHTML='<b>'+st.list.length.toLocaleString()+'</b> 张';
    if(!st.list.length){
      $('empty').hidden=false;
      $('empty').innerHTML='没有匹配的条目。<br>试试「空我」「OOO」「Greeed」「腰带」等关键词，或切换类别。';
      $('morewrap').hidden=true;
      return;
    }
    $('empty').hidden=true;
    push();
  }

  function push(){
    var g=$('grid'), end=Math.min(st.shown+PAGE, st.list.length);
    var frag=document.createDocumentFragment();
    for(var i=st.shown;i<end;i++){
      frag.appendChild(card(st.list[i]));
    }
    g.appendChild(frag);
    st.shown=end;
    var rest=st.list.length-st.shown;
    $('morewrap').hidden = rest<=0;
    if(rest>0) $('more').textContent='加载更多（还有 '+rest.toLocaleString()+' 张）';
  }

  function card(x){
    var d=document.createElement('div');
    d.className='card';
    d.innerHTML='<div class="ph"><img loading="lazy" alt="'+esc(x.n)+'"></div>'+
      '<span class="cat">'+esc(x.c)+'</span>'+
      '<div class="cap">'+esc(x.n)+'</div>';
    var img=d.querySelector('img');
    img.onload=function(){img.classList.add('ok');};
    img.onerror=function(){
      // Pages 慢时回落到 jsDelivr
      if(!this.dataset.r){ this.dataset.r='1'; this.src=CDN+encodeURI(x.p); }
    };
    img.src=encodeURI(x.p);
    d.onclick=function(){ open(x); };
    return d;
  }

  var cur=null;
  function open(x){
    cur=x;
    $('tname').textContent=x.n;
    $('tjp').textContent=x.j;
    $('ttags').innerHTML='<span class="pill e">'+esc(x.c)+'</span>'+
      '<span class="pill">'+esc(x.s)+'</span>'+
      (x.y?'<span class="pill">'+x.y+'</span>':'')+
      (x.e?'<span class="pill">'+x.e+'</span>':'');
    var b=$('bigimg');
    b.onerror=function(){ if(!this.dataset.r){this.dataset.r='1'; this.src=CDN+encodeURI(x.p);} };
    b.src=encodeURI(x.p);
    $('cdn').value=CDN+x.p;
    $('gh').value=RAW+x.p;
    $('offi').href=x.u||'#';
    $('dl').href=CDN+x.p;
    $('dl').setAttribute('download', (x.c==='骑士'?'rider_':x.c==='形态'?'form_':x.c==='人物'?'char_':x.c==='怪人'?'monster_':'item_')+x.i+'.webp');
    $('mask').classList.add('on'); $('sheet').classList.add('on');
    $('copycdn').onclick=function(){copy($('cdn').value,this);};
    $('copygh').onclick=function(){copy($('gh').value,this);};
  }
  function close(){
    $('mask').classList.remove('on'); $('sheet').classList.remove('on');
  }

  // 右上角统计
  setTimeout(function(){
    var n=DATA.length;
    if(n) $('stat').innerHTML='共 <b>'+n.toLocaleString()+'</b> 张';
  },600);
})();
</script>
</body>
</html>
